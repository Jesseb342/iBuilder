name: Historical NX2Apple engine reconstruction check

on:
  push:
    branches:
      - recovery/nx2apple-history
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  apply-historical-patch-queue:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Nov 15 snapshot (53 patches)
            nx2apple_ref: 4be5b144ee764b620bbe094f5a03ebca9853e429
          - label: Nov 15 snapshot (55 patches)
            nx2apple_ref: 10f489aef6d8b6df94c6fdfe9d629f9381d80ab6
          - label: Nov 18 snapshot (60 patches)
            nx2apple_ref: 6432e020deb70b258d91b75457e291b25dd17d39
          - label: Nov 18 snapshot (53 patches)
            nx2apple_ref: 692775225724dca6c95d93dadef85235bf131628
          - label: Nov 16 snapshot (58 patches)
            nx2apple_ref: d5452a5ed0f76a57d42bdf92477dcf37fda3c14e

    steps:
      - uses: actions/checkout@v4

      - name: Fetch nxnative and NX2Apple snapshot
        shell: bash
        env:
          NX2APPLE_REF: ${{ matrix.nx2apple_ref }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/seedds/nxnative.git nxnative
          git clone --filter=blob:none https://github.com/LNPANDY/NX2Apple.git nx2apple
          git -C nx2apple fetch --quiet --depth=1 origin "$NX2APPLE_REF"
          git -C nx2apple checkout --quiet --detach FETCH_HEAD
          echo "NX2Apple snapshot: $(git -C nx2apple rev-parse HEAD)"
          echo "Pinned nxnative base: $(cat nx2apple/.upstream-ref)"

      - name: Apply patch queue to its declared upstream base
        shell: bash
        run: |
          set -uo pipefail
          pin="$(tr -d '\r\n' < nx2apple/.upstream-ref)"
          git -C nxnative fetch --quiet --depth=1 origin "$pin"
          git -C nxnative checkout --quiet --detach FETCH_HEAD
          git -C nxnative config user.name "iBuilder reconstruction test"
          git -C nxnative config user.email "ci@example.invalid"
          echo "Checked out declared base: $(git -C nxnative rev-parse HEAD)"
          total="$(awk '/^[0-9][0-9][0-9][0-9]-.*\.patch$/ { n++ } END { print n+0 }' nx2apple/patches/series)"
          applied=0
          failed=""
          while IFS= read -r patch; do
            [[ -z "$patch" || "$patch" == \#* ]] && continue
            echo "::group::Applying $patch"
            if git -C nxnative am -3 "$GITHUB_WORKSPACE/nx2apple/patches/$patch"; then
              applied=$((applied + 1))
              echo "Applied: $patch"
            else
              failed="$patch"
              echo "::error::First patch failure: $patch"
              git -C nxnative status --short || true
              git -C nxnative am --abort || true
              echo "::endgroup::"
              break
            fi
            echo "::endgroup::"
          done < nx2apple/patches/series

          {
            echo "### ${{ matrix.label }}"
            echo "- NX2Apple snapshot: ${{ matrix.nx2apple_ref }}"
            echo "- Declared nxnative base: $pin"
            echo "- Patch queue entries: $total"
            echo "- Applied: $applied"
            if [[ -n "$failed" ]]; then
              echo "- First failure: $failed"
            else
              echo "- Result: **all patches applied**"
              echo "- Reconstructed tree: $(git -C nxnative rev-parse HEAD)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "RESULT total=$total applied=$applied first_failure=${failed:-none}"
          [[ -z "$failed" ]]
